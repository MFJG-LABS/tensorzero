name: MFJG synthetic gateway qualification

# Deliberately no pull_request, pull_request_target, push or schedule trigger.
# The runner label must be enrolled separately after host capacity qualification.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full commit SHA on the selected MFJG branch
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mfjg-tensorzero-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'MFJG-LABS/tensorzero' && startsWith(github.ref, 'refs/heads/mfjg/') && inputs.expected_sha == github.sha
    runs-on: [self-hosted, Linux, ARM64, tensorzero-qualified]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source and harness
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          python3 -m unittest discover -s ci/mfjg -p 'test_*.py'
          bash -n ci/mfjg/qualify-gateway.sh
      - name: Qualify original image
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open("ci/mfjg/baseline.json"))["gateway_image"])')
          provider=$(python3 -c 'import json; print(json.load(open("ci/mfjg/baseline.json"))["synthetic_provider_image"])')
          docker pull "$baseline"
          docker pull "$provider"
          mkdir -p qualification
          bash ci/mfjg/qualify-gateway.sh "$baseline" qualification/upstream
      - name: Rebuild exact candidate and qualify
        run: |
          image="mfjg-tensorzero-qualification:$GITHUB_SHA"
          docker build --build-arg CARGO_BUILD_FLAGS=--locked --build-arg PROFILE=performance \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/MFJG-LABS/tensorzero \
            --label "org.opencontainers.image.version=2026.6.0-mfjg.0-ci.$GITHUB_SHA" \
            -f crates/gateway/Dockerfile -t "$image" .
          candidate=$(docker image inspect "$image" --format '{{.Id}}')
          bash ci/mfjg/qualify-gateway.sh "$candidate" qualification/candidate
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('qualification/upstream/parity.json').read_text())
          candidate = json.loads(Path('qualification/candidate/parity.json').read_text())
          assert baseline == candidate, (baseline, candidate)
          print('Candidate matches baseline synthetic contract')
          PY
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mfjg-tensorzero-${{ github.sha }}
          path: qualification/
          if-no-files-found: warn
